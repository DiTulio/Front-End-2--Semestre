<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsividade e animações com tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script scr="https://cnd.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- <script>
        tailwind.config = {
            extende: 
                keyframes:
        }
    </script> -->
</head>
<body class="m-4">
    <!-- bp do tailwindcss -> sm, md, lg, xl, 2xl -->  
     <!-- @apply -->
    <div class="bg-red-500 md:bg-green-500 lg:bg-blue-500">Cor muda com o tamanho da tela</div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
        <div class="bg-gray-200 p-4">Item 1</div>
        <div class="bg-gray-200 p-4">Item 2</div>
        <div class="bg-gray-200 p-4">Item 3</div>
    </div>

    <!-- animações -->

    <div class="w-16 h-16 bg-purple-500 mt-8 animate-spin"></div>

    <div class="max-w-sm mx-auto mt-10 p-6 bg-white rounded-xl shadow-md hover:shadow-xl transform hover:scale-105 transition duration-500" hover:bg-[linear-gradient(45deg,_red,_pink,_green)] bg-[length:22-%_20%] bg-[position:0%]
    transition-[background-position]>
        <h2 class="text-xl font-bold text-gray-900">Título do Card</h2>
        <p class="mt-2 text-gray-600">Esse é um exemplo de card animado e responsivo com Tailwind CSS</p>
    </div>
</body>
</html>
